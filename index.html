<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bar Prep Quiz</title>
  <meta name="description" content="Practice questions and flashcards for US bar exam subjects, in Ukrainian and English.">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232b4c7e'/%3E%3Cpath d='M32 14v34M20 48h24M18 22h28M18 22l-6 14h12zM46 22l-6 14h12z' stroke='%23fff' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <script>
    // Apply saved theme and language before first paint to avoid a flash.
    try {
      var s = (JSON.parse(localStorage.getItem('barquiz.v1') || '{}').settings) || {};
      if (s.theme) document.documentElement.setAttribute('data-theme', s.theme);
      if (s.lang) document.documentElement.lang = s.lang;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button class="brand" id="homeBtn" type="button">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v15M7.5 19h9M6 7h12M6 7l-2.5 5.5h5zM18 7l-2.5 5.5h5z"/></svg>
        <span id="brandText">Bar Prep Quiz</span>
      </button>
      <div class="controls">
        <div class="seg" role="group" aria-label="Language / Мова">
          <button type="button" data-lang="uk">UA</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button type="button" class="icon-btn" id="themeBtn">
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="app" class="wrap" tabindex="-1">
    <p class="loading">…</p>
  </main>

  <footer class="disclaimer">
    <p><strong>Educational tool, not legal advice</strong><span id="disclaimerUk"></span></p>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
